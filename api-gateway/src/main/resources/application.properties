spring.application.name=api-gateway
server.port=8085

# Eureka Server Adresi
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Cart Service Yönlendirmesi
spring.cloud.gateway.server.webmvc.routes[0].id=cart-ms
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CART-MS
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/shoppingcart/**

# Inventory Service Yönlendirmesi
spring.cloud.gateway.server.webmvc.routes[1].id=inventory-ms
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://INVENTORY-MS
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/inventory/**

# User Service Yönlendirmesi
spring.cloud.gateway.server.webmvc.routes[2].id=user-ms
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-MS
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/auth/**,/api/users/**

# Order Service Yönlendirmesi
spring.cloud.gateway.server.webmvc.routes[3].id=order-ms
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDER-MS
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**

# Payment Service Yönlendirmesi
spring.cloud.gateway.server.webmvc.routes[4].id=payment-ms
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-MS
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payment/**







